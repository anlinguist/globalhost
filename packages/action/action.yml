# globalhost dispatcher steps (P1-07, P1-12, P2-01), used by templates/.github/workflows/globalhost*.yml in product
# repos and pinned there by commit SHA. The steps' logic lives in packages/dispatch; this action only
# installs the factory at the pinned commit (lockfile-exact) and runs `globalhost dispatch <step>`.
#   gate, run      globalhost.yml (dispatcher: trust gate, then the planner/builder run and publish)
#   observe        globalhost-release.yml (post-merge deploy report)
#   review-gate    globalhost-review.yml, read-only job: outputs action, pr, timeout
#   review         globalhost-review.yml, environment globalhost-review: claim, reserve, review, archive, post
# Environment each step needs: packages/dispatch/README.md.
name: globalhost
description: Run one globalhost dispatcher step (gate, run, observe, review-gate or review)
inputs:
  step:
    description: gate | run | observe | review-gate | review
    required: true
outputs:
  action:
    description: "gate: ignore | start | resume. review-gate: ignore | review | unlabel"
    value: ${{ steps.dispatch.outputs.action }}
  role:
    description: "gate: planner | builder"
    value: ${{ steps.dispatch.outputs.role }}
  issue:
    description: "gate: issue number"
    value: ${{ steps.dispatch.outputs.issue }}
  pr:
    description: "gate: PR number (resume). review-gate: PR number (review, unlabel)"
    value: ${{ steps.dispatch.outputs.pr }}
  comment:
    description: "gate: steering comment id (resume)"
    value: ${{ steps.dispatch.outputs.comment }}
  timeout:
    description: "review-gate: the review job's timeout-minutes (= limits.perRunMinutes; review, unlabel)"
    value: ${{ steps.dispatch.outputs.timeout }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false
    - name: Install the factory at this action's commit
      shell: bash
      working-directory: ${{ github.action_path }}/../..
      run: |
        corepack enable
        pnpm install --frozen-lockfile --filter "@globalhost/cli..."
        pnpm --filter "@globalhost/cli..." build
    - id: dispatch
      name: globalhost dispatch
      shell: bash
      env:
        STEP: ${{ inputs.step }}
      run: node "$GITHUB_ACTION_PATH/../cli/dist/bin.js" dispatch "$STEP"
