# Mirrors ONBOARDING §4 with fake ids and placeholder projects: every top-level key spelled out.
version: 1
product: sample-app
owners:
  - { login: octo-owner, id: 1001 }
autonomy: L1
project: null

git:
  defaultBranch: main
  baseBranch: main

environments:
  dev:  { gcpProject: sample-app-dev, region: us-central1 }
  prod: { gcpProject: sample-app,     region: us-central1 }

parts:
  web:
    path: .
    profile: fake-web
    config:
      port: 8080
      routes: ["/", "/stories"]
    preview: { enabled: true }
    release:
      - adapter: fake-deploy
        config: { project: sample-app, trigger: "<trigger-name>" }
    dependsOn: []

limits:
  maxConcurrentBuilders: 1
  perRunUsd: 4
  perRunMinutes: 45
  dailyUsd: 20

guardrails:
  loadBearing: ["app/api/**", "proxy.ts", "lib/firebase*"]
  immutable: []

autoMerge: []

notifications:
  blocking: push
  previews: digest
  routine: digest
