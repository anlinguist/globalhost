# globalhost release observer (rendered into product repos by `globalhost install`; PLAN P1-12, ARCHITECTURE §2.7).
# After a merge to the default branch, watches each part's cloud-build-trigger build for the merge commit, comments
# the result on the merged PR (and a factory PR's issue), and closes the issue once prod deployed. It deploys nothing.
# Repo variables (identifiers, not secrets): GLOBALHOST_RELEASE_WIF_PROVIDER, GLOBALHOST_RELEASE_SA (a GCP identity
# that can only read Cloud Build builds and triggers in the prod project, bound to this workflow on the default branch).
name: globalhost-release

on:
  push:

permissions: {}

# One observer per commit; a re-run replaces the comment it wrote.
concurrency:
  group: globalhost-release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  observe:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    # OBSERVE_TIMEOUT_MINUTES is at most 60; the rest is setup.
    timeout-minutes: 75
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write # WIF: read-only Cloud Build access in the prod project
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GLOBALHOST_RELEASE_WIF_PROVIDER }}
          service_account: ${{ vars.GLOBALHOST_RELEASE_SA }}
      - uses: anlinguist/globalhost/packages/action@0000000000000000000000000000000000000000 # globalhost-action-sha (set by `globalhost install`)
        with:
          step: observe
        env:
          GITHUB_TOKEN: ${{ github.token }}
