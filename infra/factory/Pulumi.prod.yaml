# Stack `prod`. `pulumi stack init` adds `secretsprovider` and `encryptedkey` here (both safe to commit:
# the data key is encrypted with the KMS key and useless without it). Identifiers only; no secret values.
# billingAccount is set by the owner with `pulumi config set --secret`, so it is stored encrypted.
config:
  gcp:project: globalhost-factory
  gcp:region: us-central1
  # Budgets API calls need a quota project when run with user credentials.
  gcp:billingProject: globalhost-factory
  gcp:userProjectOverride: "true"
  globalhost-factory:githubOwnerId: "47403803"
  # Product repos whose `globalhost` environment may impersonate sa:gh-dispatch.
  # Pinned by immutable repository ID; `ref` must be the repo's default branch.
  globalhost-factory:dispatchRepos:
    - name: anlinguist/numu-know
      id: "338675328"
      defaultBranch: main
  # This repo: only its main-branch .github/workflows/access-guard-image.yml may publish images.
  globalhost-factory:factoryRepoName: anlinguist/globalhost
  globalhost-factory:factoryRepoId: "1437394155"
  # Hosted previews (PLAN P1-11). Each product's PR workflow deploys into its -dev project only.
  globalhost-factory:previews:
    - product: numu-know
      devProject: numu-know-dev
      repo: {name: anlinguist/numu-know, id: "338675328", defaultBranch: main}
      parts: [web]
  # Post-merge deploy reports (PLAN P1-12, ADR-0017): read-only Cloud Build access on each prod project.
  globalhost-factory:releaseObservers:
    - product: numu-know
      prodProject: numu-know
      repo: {name: anlinguist/numu-know, id: "338675328", defaultBranch: main}
      # The prod Cloud Build triggers, imported as they are live (ADR-0019); change them here, then `pulumi up`.
      triggers:
        - key: main
          id: 769b4e4c-bf17-456c-b380-ed9b5e176802
          name: rmgpgab-numu-know-us-central1-anlinguist-Numu-Know--mafyn
          description: Build and deploy to Cloud Run service numu-know on push to "^main$" (cloudbuild.yaml)
          branch: ^main$
          filename: cloudbuild.yaml
          service: numu-know
          substitutions: {_REGION: us-central1}
          tags: [gcp-cloud-build-deploy-cloud-run, gcp-cloud-build-deploy-cloud-run-managed, numu-know]
        - key: staging
          id: 4b81e1d4-2dd8-42bb-8532-842ff4ec729c
          name: rmgpgab-staging-numu-know-us-central1-anlinguist-numu-know--qlh
          description: DISABLED 2026-11-03 - main now deploys staging-numu-know (the www service); was on push to "^staging$"
          disabled: true
          branch: ^staging$
          filename: cloudbuild.yaml
          service: staging-numu-know
          substitutions:
            _DEPLOY_REGION: us-central1
            _GCR_HOSTNAME: us.gcr.io
            _LABELS: gcb-trigger-id=4b81e1d4-2dd8-42bb-8532-842ff4ec729c
            _PLATFORM: managed
            _REGION: us-central1
            _TRIGGER_ID: 4b81e1d4-2dd8-42bb-8532-842ff4ec729c
          tags: [gcp-cloud-build-deploy-cloud-run, gcp-cloud-build-deploy-cloud-run-managed, staging-numu-know]
  # Product repos whose default-branch globalhost-review.yml, in environment `globalhost-review`, may act as
  # sa:globalhost-gh-review (PLAN P2-01, ADR-0018). Each must match a dispatchRepos entry.
  globalhost-factory:reviewRepos:
    - name: anlinguist/numu-know
      id: "338675328"
      defaultBranch: main
  # Whose pull_request events get preview credentials: the owner (anlinguist) and the factory App's bot user.
  globalhost-factory:previewActorIds: ["47403803", "350478808"]
  # Published by access-guard-image.yml on main (2b285c9); change only by PR.
  globalhost-factory:accessGuardImage: us-central1-docker.pkg.dev/globalhost-factory/globalhost-images/access-guard@sha256:f7cd43a34fddba959dfe61ab14997545b9ecdcc6b91c0c57dffba6bfa11630e5
  # globalhost-factory:cloudflare: secret object {accountId, zoneId, zone, teamDomain, ownerEmails}; see README.
  globalhost-factory:billingAccount:
    secure: v1:Zc/Y0xN5ABtVwYJl:yat2q/uZGaOUg1i/AmGrUjUdX42iKiHt43oNCDmv0NWJh6Zq
  cloudflare:apiToken:
    secure: v1:pCTGdRKyKPaI1SVb:EEpHmJoqSetcNdRhDubzwKfocFEHrs9n38azEPxlqU5Mj5VY/rdcCoqU05kAHP4fIOPe+OBjRqflVdNZImDLSnrY7YbI
  globalhost-factory:cloudflare:
    accountId:
      secure: v1:vElxDw8MVMcwSjUi:p8utHV06iIn3oFHjWy06Zao4HuDt3WG6mbxl3GLPEWWRFgR+nE2qjYOoeyScBx5A
    zoneId:
      secure: v1:7pJbcOKJN8HVRPaC:4fkTD4Sgp/Y8b+fVq+lmOQHpGV6j7vnU88yHtx7OKoN+JEWr4ozFyN52wGQ2YgNo
    zone:
      secure: v1:Te1RLrGn/hz2rNUH:jOTAdw0+yxx/OIKntj/1Dt8Xg1EQTqeqwUbnOHg=
    teamDomain:
      secure: v1:7aKqRvRvVYd+oamr:5Ea/Kg5WPAADbsuF+Kw2CQVpj7AR4Nuh3uV5WqTDxdQyB4VkjF3eosY5YpWL7uE57uEEpK8=
    ownerEmails:
