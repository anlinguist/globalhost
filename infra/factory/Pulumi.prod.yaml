# Stack `prod`. `pulumi stack init` adds `secretsprovider` and `encryptedkey` here (both safe to commit:
# the data key is encrypted with the KMS key and useless without it). Identifiers only; no secret values.
# billingAccount is set by the owner with `pulumi config set --secret`, so it is stored encrypted.
config:
  gcp:project: globalhost-factory
  gcp:region: us-central1
  # Budgets API calls need a quota project when run with user credentials.
  gcp:billingProject: globalhost-factory
  gcp:userProjectOverride: "true"
  globalhost-factory:githubOwnerId: "47403803"
  # Product repos whose `globalhost` environment may impersonate sa:gh-dispatch.
  # Pinned by immutable repository ID; `ref` must be the repo's default branch.
  globalhost-factory:dispatchRepos:
    - name: anlinguist/numu-know
      id: "338675328"
      defaultBranch: main
  # This repo: only its main-branch .github/workflows/access-guard-image.yml may publish images.
  globalhost-factory:factoryRepoName: anlinguist/globalhost
  globalhost-factory:factoryRepoId: "1437394155"
  # Hosted previews (PLAN P1-11). Each product's PR workflow deploys into its -dev project only.
  globalhost-factory:previews:
    - product: numu-know
      devProject: numu-know-dev
      repo: { name: anlinguist/numu-know, id: "338675328", defaultBranch: main }
      parts: [web]
  # Whose pull_request events get preview credentials: the owner (anlinguist) and the factory App's bot user.
  globalhost-factory:previewActorIds: ["47403803", "350478808"]
  # globalhost-factory:accessGuardImage: set after the first access-guard image publish (digest-pinned).
  # globalhost-factory:cloudflare: secret object {accountId, zoneId, zone, teamDomain, ownerEmails}; see README.
  globalhost-factory:billingAccount:
    secure: v1:Zc/Y0xN5ABtVwYJl:yat2q/uZGaOUg1i/AmGrUjUdX42iKiHt43oNCDmv0NWJh6Zq
secretsprovider: gcpkms://projects/globalhost-factory/locations/global/keyRings/pulumi/cryptoKeys/state
encryptedkey: CiQAJkobxthngidnKOwAS5IqoIxB1TJFnROdFK4DuoJtI+u63ewSSQBZ/gBb9uiz7NSW9JMdS8Ribo2OnuldxvM3svXEwBP5MISxWmWcwB73+snpTQW7+fL8J9dtzyVbB2JSyKLXoP75NzPGcYdxBrc=
